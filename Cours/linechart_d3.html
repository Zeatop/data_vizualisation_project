<!DOCTYPE html>
<html>
  <head>
       <title>Line chart with pure SVG</title>
       <script type="text/javascript" src="https://d3js.org/d3.v5.min.js"></script>
  </head>
   <body>
      <svg></svg>
      <script>
        // define the data
        var data = [
          { date: "2014-01-01", amount:10 },
          { date: "2014-02-01", amount:20 },
          { date: "2014-03-01", amount:40 },
          { date: "2014-04-01", amount:80 }
        ]

        // define the dimensions of the chart
        var margin = {
          left: 20,
          top: 10,
          bottom: 20,
          right: 10
        }, // the margins of the chart
        width = 350, // the width of the svg
        height = 160; // the height of the svg

        // set the dimensions of the svg
        var svg = d3.select("svg")
          .attr('width', width + margin.left + margin.right)
          .attr('height', height + margin.top + margin.bottom)

        // create a group that will contain the chart
        var chartGroup = svg.append("g")
          .attr('transform', "translate(" + margin.left + "," + margin.top + ")")


        var yScale = d3.scaleLinear()
          .domain(d3.extent(data, d => d.amount))
          .range([height, 0]) 

        var xScale = d3.scaleTime()
          .domain([
            new Date("2014-01-01"), 
            new Date("2014-04-01")
          ])
          .range([0, width])
 
        // create the x axis based on the xScale object
        var xAxis = d3.axisBottom(xScale)
          .ticks(4)
          .tickFormat(d3.timeFormat("%b"))

        // create the y axis based on the yScale object
        var yAxis = d3.axisLeft(yScale)
          .ticks(4);

        chartGroup.append("g")
          .attr('transform', "translate(0, 0)")
          .classed('y-axis', true)
          .call(yAxis)

        chartGroup.append("g")
          .attr('transform', "translate(0," + height + ")")
          .classed('x-axis', true)
          .call(xAxis)

        chartGroup.selectAll("circle")
          .data(data)
          .enter()
          .append("circle")
          .attr("cx", d => xScale(new Date(d.date)))
          .attr("cy", d => yScale(d.amount))
          .attr("r", 5)
          .style("fill", "steelblue")


        var lineGenerator = d3.line()
          .x(d => xScale(new Date(d.date)))
          .y(d => yScale(d.amount))

        // draw the line
        chartGroup.append("path")
          .datum(data)
          .attr("class", "line")
          .attr("fill", "none")
          .attr("stroke", "steelblue")
          .attr("stroke-width", 1.5)
          .attr("d", lineGenerator)



      </script>
   </body>
</html>
