<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive network visualization of US flight connections by routes, time periods, and delay causes.">
    <title>USA Flight Network Analysis - Connection Map</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://d3js.org/d3.v5.min.js"></script>
    <script src="https://unpkg.com/topojson@3"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="map-card-wrapper">
    <div class="map-card">
        <h1 class="chart-card-title">🗺️ Réseau de vols USA - Analyse interactive</h1>

        <div id="app-container">

    <!-- CONTRÔLE PANEL - Shneiderman #3 (Shortcuts) et #7 (Control) -->
    <header id="control-panel">
        <div class="controls-row">
            <div class="control-group">
                <label for="dataset-select">MODE</label>
                <select id="dataset-select" class="styled-select" aria-label="Select visualization mode">
                    <option value="month">Par Mois</option>
                    <option value="week">Par Semaine</option>
                    <option value="late">Par Type de Retard</option>
                </select>
            </div>

            <div id="time-controls" class="control-group wide">
                <label for="month-select">MOIS</label>
                <select id="month-select" class="styled-select" aria-label="Select month">
                    <option value="1">Janvier</option>
                    <option value="2">Février</option>
                    <option value="3">Mars</option>
                    <option value="4">Avril</option>
                    <option value="5">Mai</option>
                    <option value="6">Juin</option>
                    <option value="7">Juillet</option>
                    <option value="8">Août</option>
                    <option value="9">Septembre</option>
                    <option value="10">Octobre</option>
                    <option value="11">Novembre</option>
                    <option value="12">Décembre</option>
                </select>
            </div>

            <div id="week-controls" class="control-group wide hidden">
                <label for="week-select">SEMAINE</label>
                <select id="week-select" class="styled-select" aria-label="Select week">
                    <option value="1">Semaine 1</option>
                    <option value="2">Semaine 2</option>
                    <option value="3">Semaine 3</option>
                    <option value="4">Semaine 4</option>
                    <option value="5">Semaine 5</option>
                    <option value="6">Semaine 6</option>
                    <option value="7">Semaine 7</option>
                    <option value="8">Semaine 8</option>
                    <option value="9">Semaine 9</option>
                    <option value="10">Semaine 10</option>
                    <option value="11">Semaine 11</option>
                    <option value="12">Semaine 12</option>
                    <option value="13">Semaine 13</option>
                    <option value="14">Semaine 14</option>
                    <option value="15">Semaine 15</option>
                    <option value="16">Semaine 16</option>
                    <option value="17">Semaine 17</option>
                    <option value="18">Semaine 18</option>
                    <option value="19">Semaine 19</option>
                    <option value="20">Semaine 20</option>
                    <option value="21">Semaine 21</option>
                    <option value="22">Semaine 22</option>
                    <option value="23">Semaine 23</option>
                    <option value="24">Semaine 24</option>
                    <option value="25">Semaine 25</option>
                    <option value="26">Semaine 26</option>
                    <option value="27">Semaine 27</option>
                    <option value="28">Semaine 28</option>
                    <option value="29">Semaine 29</option>
                    <option value="30">Semaine 30</option>
                    <option value="31">Semaine 31</option>
                    <option value="32">Semaine 32</option>
                    <option value="33">Semaine 33</option>
                    <option value="34">Semaine 34</option>
                    <option value="35">Semaine 35</option>
                    <option value="36">Semaine 36</option>
                    <option value="37">Semaine 37</option>
                    <option value="38">Semaine 38</option>
                    <option value="39">Semaine 39</option>
                    <option value="40">Semaine 40</option>
                    <option value="41">Semaine 41</option>
                    <option value="42">Semaine 42</option>
                    <option value="43">Semaine 43</option>
                    <option value="44">Semaine 44</option>
                    <option value="45">Semaine 45</option>
                    <option value="46">Semaine 46</option>
                    <option value="47">Semaine 47</option>
                    <option value="48">Semaine 48</option>
                    <option value="49">Semaine 49</option>
                    <option value="50">Semaine 50</option>
                    <option value="51">Semaine 51</option>
                    <option value="52">Semaine 52</option>
                </select>
            </div>

            <div id="city-filter-controls" class="control-group wide">
                <label for="city-filter">FILTRER PAR VILLE</label>
                <select id="city-filter" class="styled-select" aria-label="Filter by city">
                    <option value="">Toutes les villes</option>
                </select>
            </div>

            <div id="late-controls" class="control-group hidden">
                <label for="delay-select">CAUSE DE RETARD</label>
                <select id="delay-select" class="styled-select" aria-label="Select delay cause">
                    <option value="all">Tous les retards</option>
                    <option value="bool_carrier_delay_min">Transporteur</option>
                    <option value="bool_weather_delay_min">Météo</option>
                    <option value="bool_traffic_delay_min">Trafic</option>
                    <option value="bool_security_delay_min">Sécurité</option>
                    <option value="bool_late_aircraft_delay_min">Avion en retard</option>
                </select>
            </div>

            <div id="direction-controls" class="control-group hidden">
                <label>DIRECTION</label>
                <div class="toggle-group" role="radiogroup" aria-label="Flight direction filter">
                    <label class="toggle-option">
                        <input type="radio" name="direction" value="all" checked>
                        <span>Tous</span>
                    </label>
                    <label class="toggle-option">
                        <input type="radio" name="direction" value="outbound">
                        <span>Départs</span>
                    </label>
                    <label class="toggle-option">
                        <input type="radio" name="direction" value="inbound">
                        <span>Arrivées</span>
                    </label>
                </div>
            </div>

            <button id="reset-view-btn" class="btn-secondary" title="Réinitialiser la vue">↻ Réinitialiser</button>

        </div>
    </header>

    <!-- MAIN VISUALIZATION AREA -->
    <main id="map-wrapper" role="main" aria-label="Flight network visualization">
        <div id="tooltip" class="tooltip hidden" role="tooltip" aria-hidden="true"></div>

        <!-- LEGEND - Shneiderman #1, Munzner (Expressiveness) -->
        <div id="legend-panel" class="legend-panel" role="complementary" aria-label="Legend">
            <div class="legend-title">Légende</div>

            <div class="legend-section">
                <div class="legend-subtitle">Villes</div>
                <div class="legend-item">
                    <svg width="25" height="25" style="display:inline-block;margin-right:6px">
                        <circle cx="12" cy="12" r="3" fill="#e0f2fe"></circle>
                    </svg>
                    <span>Petit (peu de vols)</span>
                </div>
                <div class="legend-item">
                    <svg width="25" height="25" style="display:inline-block;margin-right:6px">
                        <circle cx="12" cy="12" r="8" fill="#001f3f"></circle>
                    </svg>
                    <span>Grand (beaucoup de vols)</span>
                </div>
            </div>

            <div class="legend-section">
                <div class="legend-subtitle">Routes</div>
                <div class="legend-item">
                    <svg width="50" height="15" style="display:inline-block;margin-right:6px">
                        <line x1="0" y1="7" x2="50" y2="7" stroke="#2563eb" stroke-width="2"></line>
                    </svg>
                    <span>Départs</span>
                </div>
                <div class="legend-item">
                    <svg width="50" height="15" style="display:inline-block;margin-right:6px">
                        <line x1="0" y1="7" x2="50" y2="7" stroke="#db2777" stroke-width="2"></line>
                    </svg>
                    <span>Arrivées</span>
                </div>
            </div>
        </div>

        <!-- ZOOM CONTROLS - Shneiderman #1 (zoom/filter) -->
        <div class="zoom-controls" role="toolbar" aria-label="Zoom controls">
            <button class="zoom-btn" id="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
            <button class="zoom-btn" id="zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
            <button class="zoom-btn" id="zoom-reset" title="Reset zoom" aria-label="Reset zoom">⊡</button>
        </div>
    </main>

    </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
