<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USA Flight Network Analysis</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <script src="https://d3js.org/d3.v5.min.js"></script>
    <script src="https://unpkg.com/topojson@3"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="map-card-wrapper">
    <div class="map-card">
        <h2 class="chart-card-title">🗺️ Réseau de vols - Analyse géographique</h2>
        
        <div id="app-container">

    <header id="control-panel">
        <div class="controls-row">
            <div id="late-controls" class="control-group hidden">
                <label>DELAY CAUSE</label>
                <select id="delay-select" class="styled-select">
                    <option value="all">All Delays</option>
                    <option value="bool_carrier_delay_min">Carrier</option>
                    <option value="bool_weather_delay_min">Weather</option>
                    <option value="bool_traffic_delay_min">Traffic</option>
                    <option value="bool_security_delay_min">Security</option>
                    <option value="bool_late_aircraft_delay_min">Late Aircraft</option>
                </select>
            </div>

            <div id="direction-controls" class="control-group hidden">
                <label>DIRECTION</label>
                <div class="toggle-group">
                    <label class="toggle-option">
                        <input type="radio" name="direction" value="all" checked>
                        <span>All</span>
                    </label>
                    <label class="toggle-option">
                        <input type="radio" name="direction" value="outbound">
                        <span>Out</span>
                    </label>
                    <label class="toggle-option">
                        <input type="radio" name="direction" value="inbound">
                        <span>In</span>
                    </label>
                </div>
            </div>

        </div>
    </header>

    <main id="map-wrapper">
        <div id="tooltip" class="tooltip hidden"></div>

        <!-- LEGEND -->
        <div id="legend-panel" class="legend-panel">
            <div class="legend-title">Légende</div>

            <div class="legend-section">
                <div class="legend-subtitle">Trafic aérien</div>
                <div style="margin-bottom: 8px;">
                    <svg width="100%" height="50" style="display:block;">
                        <defs>
                            <linearGradient id="traffic-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" style="stop-color:#e0f2fe;stop-opacity:1" />
                                <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <!-- Petit cercle à gauche -->
                        <circle cx="5" cy="8" r="3" fill="#e0f2fe" stroke="#64748b" stroke-width="0.5"/>
                        <!-- Grand cercle à droite -->
                        <circle cx="95%" cy="8" r="8" fill="#1e3a8a" stroke="#fff" stroke-width="0.5"/>
                        <!-- Barre de gradient -->
                        <rect x="0" y="20" width="100%" height="15" fill="url(#traffic-gradient)" rx="2"/>
                        <text x="0" y="47" font-size="9" fill="#64748b">Faible</text>
                        <text x="100%" y="47" font-size="9" fill="#64748b" text-anchor="end">Élevé</text>
                    </svg>
                </div>
            </div>

            <div class="legend-section hidden" id="legend-directions">
                <div class="legend-subtitle">Direction des routes</div>
                <div class="legend-item">
                    <svg width="50" height="15" style="display:inline-block;margin-right:6px">
                        <line x1="0" y1="7" x2="50" y2="7" stroke="#2563eb" stroke-width="2"></line>
                    </svg>
                    <span>Départs</span>
                </div>
                <div class="legend-item">
                    <svg width="50" height="15" style="display:inline-block;margin-right:6px">
                        <line x1="0" y1="7" x2="50" y2="7" stroke="#db2777" stroke-width="2"></line>
                    </svg>
                    <span>Arrivées</span>
                </div>
            </div>
        </div>
    </main>

    </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
