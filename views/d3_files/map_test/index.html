<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USA Flight Network Analysis</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <script src="https://d3js.org/d3.v5.min.js"></script>
    <script src="https://unpkg.com/topojson@3"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app-container">

    <header id="control-panel">
        <div class="brand">
            <h2>Flight Map</h2>
        </div>

        <div class="controls-row">

            <div class="control-group">
                <label>MODE</label>
                <select id="dataset-select" class="styled-select">
                    <option value="month">By Month</option>
                    <option value="week">By Week</option>
                    <option value="late">By Delay Type</option>
                </select>
            </div>

            <div id="time-controls" class="control-group wide">
                <div class="flex-between">
                    <label id="time-label">MONTH</label>
                    <span id="time-display" class="badge">January</span>
                </div>
                <input type="range" id="time-slider" class="styled-slider" min="1" max="12" value="1" step="1">
            </div>

            <div id="late-controls" class="control-group hidden">
                <label>DELAY CAUSE</label>
                <select id="delay-select" class="styled-select">
                    <option value="all">All Delays</option>
                    <option value="bool_carrier_delay_min">Carrier</option>
                    <option value="bool_weather_delay_min">Weather</option>
                    <option value="bool_traffic_delay_min">Traffic</option>
                    <option value="bool_security_delay_min">Security</option>
                    <option value="bool_late_aircraft_delay_min">Late Aircraft</option>
                </select>
            </div>

            <div class="control-group">
                <label>FOCUS CITY</label>
                <select id="city-search" class="styled-select">
                    <option value="">Show All Routes</option>
                </select>
            </div>

            <div id="direction-controls" class="control-group hidden">
                <label>DIRECTION</label>
                <div class="toggle-group">
                    <label class="toggle-option">
                        <input type="radio" name="direction" value="all" checked>
                        <span>All</span>
                    </label>
                    <label class="toggle-option">
                        <input type="radio" name="direction" value="outbound">
                        <span>Out</span>
                    </label>
                    <label class="toggle-option">
                        <input type="radio" name="direction" value="inbound">
                        <span>In</span>
                    </label>
                </div>
            </div>

            <div class="control-group">
                <label>&nbsp;</label> <button id="reset-btn" class="btn-secondary">Reset</button>
            </div>

        </div>
    </header>

    <main id="map-wrapper">
        <div id="tooltip" class="tooltip hidden"></div>
    </main>

</div>

<script src="script.js"></script>
</body>
</html>
