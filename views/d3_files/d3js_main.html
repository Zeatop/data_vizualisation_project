<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analyse des retards de vols - 2024</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
  }
  
  .container {
    max-width: 1800px;
    margin: 0 auto;
    background: white;
    border-radius: 15px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    overflow: hidden;
  }
  
  .header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 30px;
    text-align: center;
  }
  
  .header h1 {
    font-size: 32px;
    margin-bottom: 10px;
    font-weight: 600;
  }
  
  .header p {
    font-size: 16px;
    opacity: 0.9;
  }
  
  .controls {
    background: #f8f9fa;
    padding: 25px;
    border-bottom: 1px solid #e0e0e0;
    display: flex;
    flex-wrap: wrap;
    gap: 30px;
    align-items: center;
    justify-content: center;
  }
  
  .control-group {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  
  .control-group label.main-label {
    font-weight: 600;
    color: #333;
    font-size: 15px;
  }
  
  .control-group select {
    padding: 8px 15px;
    border: 2px solid #667eea;
    border-radius: 8px;
    font-size: 14px;
    min-width: 250px;
    cursor: pointer;
    background: white;
    transition: all 0.3s;
  }
  
  .control-group select:hover {
    border-color: #764ba2;
  }
  
  .control-group select:focus {
    outline: none;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
  }
  
  .radio-group, .checkbox-group {
    display: flex;
    gap: 15px;
    align-items: center;
  }
  
  .radio-group label, .checkbox-group label {
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    font-size: 14px;
    color: #555;
  }
  
  .radio-group input[type="radio"],
  .checkbox-group input[type="checkbox"] {
    cursor: pointer;
    width: 18px;
    height: 18px;
  }
  
  .charts-container {
    padding: 30px;
    background: white;
  }
  
  .chart-card {
    background: white;
    border-radius: 12px;
    padding: 25px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    border: 1px solid #e0e0e0;
  }
  
  .chart-card-title {
    font-size: 20px;
    font-weight: 600;
    color: #333;
    margin-bottom: 20px;
    padding-bottom: 15px;
    border-bottom: 2px solid #667eea;
  }
  
  .charts-wrapper {
    display: flex;
    gap: 30px;
    justify-content: space-between;
  }
  
  .chart-box {
    flex: 1;
    background: #fafafa;
    border-radius: 10px;
    padding: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  
  .tooltip {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    font-size: 13px;
    line-height: 1.5;
  }
  
  .myArea {
    transition: opacity 0.2s;
  }
  
  .legend-container {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    margin-bottom: 20px;
    padding: 15px;
    background: #f8f9fa;
    border-radius: 8px;
    border: 1px solid #e0e0e0;
  }
  
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    padding: 8px 12px;
    border-radius: 6px;
    transition: all 0.2s;
    background: white;
    border: 2px solid transparent;
  }
  
  .legend-item:hover {
    background: #f0f0f0;
    transform: translateY(-1px);
  }
  
  .legend-item input[type="checkbox"] {
    cursor: pointer;
    width: 18px;
    height: 18px;
  }
  
  .legend-color {
    width: 24px;
    height: 24px;
    border-radius: 4px;
    border: 2px solid rgba(0,0,0,0.1);
  }
  
  .legend-label {
    font-size: 14px;
    font-weight: 500;
    color: #333;
    user-select: none;
  }
</style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="header">
    <h1>📊 Analyse des Retards de Vols - 2024</h1>
    <p>Visualisations interactives des données de vols</p>
  </div>
  
  <!-- Controls -->
  <div class="controls">
    <div class="control-group">
      <label for="citySelect" class="main-label">Ville :</label>
      <select id="citySelect">
        <option value="">Chargement...</option>
      </select>
    </div>
    
    <div class="control-group">
      <label class="main-label">Période :</label>
      <div class="radio-group">
        <label>
          <input type="radio" name="timePeriod" value="month" checked>
          <span>Par mois</span>
        </label>
        <label>
          <input type="radio" name="timePeriod" value="week">
          <span>Par semaine</span>
        </label>
      </div>
    </div>
    
    <div class="control-group" id="time-selector-group">
      <label for="timeSelect" class="main-label">Sélection : :</label>
      <select id="timeSelect">
        <option value="1">Janvier</option>
        <option value="2">Février</option>
        <option value="3">Mars</option>
        <option value="4">Avril</option>
        <option value="5">Mai</option>
        <option value="6">Juin</option>
        <option value="7">Juillet</option>
        <option value="8">Août</option>
        <option value="9">Septembre</option>
        <option value="10">Octobre</option>
        <option value="11">Novembre</option>
        <option value="12">Décembre</option>
      </select>
    </div>
    
    <div class="control-group">
      <label for="mapCityFilter" class="main-label">Ville focus :</label>
      <select id="mapCityFilter">
        <option value="">Toutes les villes</option>
      </select>
    </div>
    
    <div class="control-group">
      <label class="main-label">Affichage :</label>
      <div class="radio-group">
        <label>
          <input type="radio" name="viewMode" value="count" checked>
          <span>Nombre</span>
        </label>
        <label>
          <input type="radio" name="viewMode" value="percentage">
          <span>Pourcentage</span>
        </label>
      </div>
    </div>
  </div>
  
  <!-- Charts -->
  <div class="charts-container">
    <!-- Flight Map Card -->
    <div class="chart-card" style="margin-top: 30px;">
      <div class="chart-card-title" style="display: flex; justify-content: space-between; align-items: center; cursor: pointer;" onclick="toggleMapVisibility()">
        <span>🗺️ Réseau de vols - Analyse géographique</span>
        <button id="map-toggle-btn" style="background: #667eea; color: white; border: none; border-radius: 6px; padding: 8px 16px; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.3s;">
          👁️ Masquer
        </button>
      </div>
      <div id="map-container" style="width: 100%; height: 700px; border: none; border-radius: 8px; overflow: hidden;">
        <iframe src="map/index.html" id="map-iframe" style="width: 100%; height: 100%; border: none; overflow: hidden;" scrolling="no"></iframe>
      </div>
    </div>
    <!-- Streamgraph Card -->
    <div class="chart-card">
      <div style="width: 100%; height: 750px; border: none; border-radius: 8px; overflow: hidden;">
        <iframe src="streamchart/index.html" id="streamchart-iframe" style="width: 100%; height: 100%; border: none; overflow: hidden;" scrolling="no"></iframe>
      </div>
    </div>
    <!-- Treemap Card -->
    <div class="chart-card">
      <div style="width: 100%; height: 750px; border: none; border-radius: 8px; overflow: hidden;">
        <iframe src="treemap/index.html" id="treemap-iframe" style="width: 100%; height: 100%; border: none; overflow: hidden;" scrolling="no"></iframe>
      </div>
    </div>

  </div>
</div>

<script>
// Toggle visibility of map
let mapVisible = true;
function toggleMapVisibility() {
  const mapContainer = document.getElementById('map-container');
  const toggleBtn = document.getElementById('map-toggle-btn');
  
  mapVisible = !mapVisible;
  
  if (mapVisible) {
    mapContainer.style.display = 'block';
    toggleBtn.textContent = '👁️ Masquer';
    toggleBtn.style.background = '#667eea';
  } else {
    mapContainer.style.display = 'none';
    toggleBtn.textContent = '👁️ Afficher';
    toggleBtn.style.background = '#94a3b8';
  }
}

// Communication avec l'iframe du streamchart
window.addEventListener('DOMContentLoaded', function() {
  const iframe = document.getElementById('streamchart-iframe');
  const mapIframe = document.getElementById('map-iframe');
  const treemapIframe = document.getElementById('treemap-iframe');
  const citySelect = document.getElementById('citySelect');
  const mapCityFilter = document.getElementById('mapCityFilter');
  const timeSelect = document.getElementById('timeSelect');
  const timePeriodRadios = document.querySelectorAll('input[name="timePeriod"]');
  const viewModeRadios = document.querySelectorAll('input[name="viewMode"]');
  
  // Fonction pour envoyer les paramètres à l'iframe
  function sendUpdateToIframe() {
    const selectedCity = citySelect.value;
    const selectedMapCity = mapCityFilter.value;
    const selectedPeriod = document.querySelector('input[name="timePeriod"]:checked').value;
    const selectedMode = document.querySelector('input[name="viewMode"]:checked').value;
    const selectedTime = timeSelect.value;
    
    // Attendre que les iframes soient chargées
    setTimeout(() => {
      // Envoyer au streamchart - utiliser mapCityFilter pour le filtrage
      // Si mapCityFilter est vide (toutes les villes), utiliser "All"
      const streamchartCity = selectedMapCity === '' ? 'All' : selectedMapCity;
      iframe.contentWindow.postMessage({
        type: 'updateStreamchart',
        city: streamchartCity,
        period: selectedPeriod,
        mode: selectedMode
      }, '*');
      
      // Envoyer la ville de focus à la carte
      mapIframe.contentWindow.postMessage({
        type: 'updateMapCity',
        city: selectedMapCity
      }, '*');
      
      // Envoyer la période et la valeur temporelle sélectionnée à la carte
      mapIframe.contentWindow.postMessage({
        type: 'updateMapPeriod',
        period: selectedPeriod,
        timeValue: selectedTime
      }, '*');
      
      // Envoyer la période et la valeur temporelle à la treemap
      treemapIframe.contentWindow.postMessage({
        type: 'updateTreemap',
        period: selectedPeriod,
        timeValue: selectedTime
      }, '*');
    }, 100);
  }
  
  // Fonction pour mettre à jour les options du dropdown temporel
  function updateTimeOptions() {
    const selectedPeriod = document.querySelector('input[name="timePeriod"]:checked').value;
    timeSelect.innerHTML = '';
    
    if (selectedPeriod === 'month') {
      timeSelect.innerHTML = `
        <option value="1">Janvier</option>
        <option value="2">Février</option>
        <option value="3">Mars</option>
        <option value="4">Avril</option>
        <option value="5">Mai</option>
        <option value="6">Juin</option>
        <option value="7">Juillet</option>
        <option value="8">Août</option>
        <option value="9">Septembre</option>
        <option value="10">Octobre</option>
        <option value="11">Novembre</option>
        <option value="12">Décembre</option>
      `;
    } else {
      for (let i = 1; i <= 52; i++) {
        timeSelect.innerHTML += `<option value="${i}">Semaine ${i}</option>`;
      }
    }
    
    sendUpdateToIframe();
  }
  
  // Écouter les changements des contrôles
  citySelect.addEventListener('change', sendUpdateToIframe);
  mapCityFilter.addEventListener('change', sendUpdateToIframe);
  timeSelect.addEventListener('change', sendUpdateToIframe);
  
  timePeriodRadios.forEach(radio => {
    radio.addEventListener('change', updateTimeOptions);
  });
  
  viewModeRadios.forEach(radio => {
    radio.addEventListener('change', sendUpdateToIframe);
  });
  
  // Recevoir la liste des villes depuis l'iframe
  window.addEventListener('message', function(event) {
    if (event.data.type === 'citiesLoaded') {
      citySelect.innerHTML = '<option value="All">🌍 Toutes les villes</option>';
      event.data.cities.forEach(city => {
        const option = document.createElement('option');
        option.value = city;
        option.textContent = city;
        citySelect.appendChild(option);
      });
      citySelect.value = 'All';
    }
    
    if (event.data.type === 'mapCitiesLoaded') {
      mapCityFilter.innerHTML = '<option value="">Toutes les villes</option>';
      event.data.cities.forEach(city => {
        const option = document.createElement('option');
        option.value = city;
        option.textContent = city;
        mapCityFilter.appendChild(option);
      });
    }
  });
});
</script>

</body>
</html>
