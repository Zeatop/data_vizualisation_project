<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>USA Flight Analysis</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://d3js.org/d3.v5.min.js"></script>
    <script src="https://unpkg.com/topojson@3"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app-container">

    <header class="control-bar">
        <div class="brand">FlightMap</div>

        <div class="controls">
            <div class="control-group">
                <label>Période</label>
                <div class="row">
                    <select id="mode-select" class="input-sm">
                        <option value="month">Par Mois</option>
                        <option value="week">Par Semaine</option>
                    </select>
                    <select id="time-select" class="input-md">
                    </select>
                </div>
            </div>

            <div class="control-group">
                <label>Filtre Retard</label>
                <select id="delay-select" class="input-md">
                    <option value="all">Tous les vols</option>
                    <option value="bool_carrier_delay_min">Cause Compagnie</option>
                    <option value="bool_weather_delay_min">Cause Météo</option>
                    <option value="bool_security_delay_min">Cause Sécurité</option>
                    <option value="bool_late_aircraft_delay_min">Avion Précédent</option>
                </select>
            </div>

            <div class="control-group">
                <label>Focus Ville</label>
                <div class="search-box">
                    <input list="cities-list" id="city-search" placeholder="Chercher une ville...">
                    <datalist id="cities-list"></datalist>
                    <button id="reset-btn" title="Réinitialiser la vue">✕</button>
                </div>
            </div>

            <div class="control-group hidden" id="direction-group">
                <label>Flux</label>
                <div class="toggle-group">
                    <label class="active"><input type="radio" name="dir" value="all" checked> Tout</label>
                    <label><input type="radio" name="dir" value="outbound"> Sorties (Départs)</label>
                    <label><input type="radio" name="dir" value="inbound"> Entrées (Arrivées)</label>
                </div>
            </div>
        </div>
    </header>

    <main id="map-wrapper">
        <div id="tooltip" class="tooltip hidden"></div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading flight data...</p>
        </div>

        <div class="info-panel">
            <div class="stat-item">
                <div class="stat-label">📊 Routes</div>
                <div class="stat-value" id="route-count">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">✈️ Flights</div>
                <div class="stat-value" id="flight-count">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">⏰ On Time</div>
                <div class="stat-value" id="ontime-pct">0%</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">⚠️ Late</div>
                <div class="stat-value" id="late-pct">0%</div>
            </div>
        </div>

        <div class="zoom-btns">
            <button id="zoom-in">+</button>
            <button id="zoom-out">−</button>
        </div>

        <div class="legend">
            <div class="legend-item"><span class="dot outbound"></span> Départs (Sortie)</div>
            <div class="legend-item"><span class="dot inbound"></span> Arrivées (Entrée)</div>
        </div>
    </main>

</div>

<script src="script.js"></script>
</body>
</html>
